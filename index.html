<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schatgraver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&family=Space+Mono:wght@700&display=swap">
<style>
/* Layout: one centred column (max 760px). On top a cross-section of the earth where a little digger sinks deeper with every answer; under it the dig card and the full haul of answers. */
/* Single dark look on purpose: the game takes place underground */
:root{
  color-scheme:dark;
  --bg:#17111F; --rock:#221a2e; --surface:#2A2038; --ink:#F4EEFF; --muted:#B5A8CB; --line:#43355A;
  --gold:#FFC94A; --gold-ink:#2B1A00; --bad:#FF6F7D;
  --g1:#A8A2B4; --g2:#B97CFF; --g3:#4FA6FF; --g4:#FF4F7E; --g5:#8EF6FF;
  --f-display:"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"Space Mono", ui-monospace, Menlo, monospace;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;min-height:100%;
  background-image:radial-gradient(ellipse 70% 40% at 15% 0%,rgba(185,124,255,.16),transparent 70%),radial-gradient(ellipse 80% 50% at 50% 100%,rgba(255,201,74,.09),transparent 70%);
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-size:1.9rem;display:flex;align-items:center;gap:8px;line-height:1}
.brand span{background:linear-gradient(180deg,#FFE29A,var(--gold) 55%,#E59A12);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #6b3d00)}
.tabs{display:flex;gap:2px;background:var(--rock);border:2px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-weight:800;color:var(--muted)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--gold);color:var(--gold-ink)}

/* ---------- the mine ---------- */
.mine{position:relative;height:280px;border-radius:18px;overflow:hidden;border:3px solid #5b3d22;box-shadow:0 6px 0 #24130a, inset 0 0 40px rgba(0,0,0,.6);background:#0d0a12}
.world{position:absolute;left:0;right:0;top:0;transition:transform 1.5s cubic-bezier(.45,.05,.3,1);will-change:transform}
.world.instant{transition:none}
.sky{position:absolute;left:0;right:0;top:0;height:200px;background:linear-gradient(180deg,#1b1640,#4a3170 60%,#c47a6a);overflow:hidden}
.sky i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.8}
.sky .moon{position:absolute;right:14%;top:34px;width:34px;height:34px;border-radius:50%;background:#fff3c9;box-shadow:0 0 30px #fff3c9}
.hill{position:absolute;bottom:0;width:180px;height:60px;border-radius:50% 50% 0 0;background:#2d2350}
.layer{position:absolute;left:0;right:0}
.layer .nm{position:absolute;left:12px;top:8px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.grass{position:absolute;left:0;right:0;height:12px;background:linear-gradient(#5fd06b,#2f8f3d);border-bottom:3px solid #1f5c28}
.mark{position:absolute;left:46%;right:10px;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.82);transform:translateY(-50%);text-shadow:0 1px 2px #000}
.mark::before{content:"";width:18px;height:2px;background:currentColor;opacity:.6;flex:none}
.mark b{font-family:var(--f-mono);color:var(--gold);flex:none}
.crystal{position:absolute;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;filter:drop-shadow(0 0 6px currentColor)}
.trail{position:absolute;left:calc(28% + 34px);transform:translate(0,-50%);filter:drop-shadow(0 0 8px rgba(255,255,255,.4))}
.dark{position:absolute;inset:0;pointer-events:none;transition:opacity 1.5s;background:radial-gradient(circle at 28% 54%,transparent 0 70px,rgba(5,3,10,.92) 190px)}
.digger{position:absolute;left:28%;top:150px;transform:translate(-50%,-100%);z-index:2}
.digger .beam{position:absolute;left:30px;top:8px;width:150px;height:70px;background:linear-gradient(90deg,rgba(255,240,180,.35),transparent);clip-path:polygon(0 0,100% -40%,100% 140%,0 18%);pointer-events:none;transition:opacity 1.5s}
.gauge{position:absolute;right:10px;top:10px;z-index:3;background:rgba(10,6,16,.75);border:2px solid #5b3d22;border-radius:12px;padding:6px 12px;text-align:right;line-height:1.1}
.gauge small{display:block;font-family:var(--f-mono);font-size:.62rem;letter-spacing:.12em;color:#f3d8a8}
.gauge b{font-family:var(--f-display);font-weight:400;font-size:1.7rem;color:var(--gold);font-variant-numeric:tabular-nums}
.gauge b span{font-size:1rem;color:#f3d8a8}
.gain{position:absolute;left:calc(28% + 30px);top:70px;z-index:3;font-family:var(--f-display);font-size:1.5rem;color:var(--gold);text-shadow:0 2px 0 #000;pointer-events:none;opacity:0}
.bit{position:absolute;width:6px;height:6px;border-radius:2px;z-index:2;pointer-events:none;opacity:0}
.pick{transform-box:view-box;transform-origin:36px 42px}
@media (prefers-reduced-motion:no-preference){
  .digger.dig .pick{animation:swing .28s ease-in-out 5 alternate}
  @keyframes swing{from{transform:rotate(-55deg)}to{transform:rotate(25deg)}}
  .digger.dig svg{animation:bob .28s ease-in-out 5 alternate}
  @keyframes bob{to{transform:translateY(3px) scaleY(.95)}}
  .digger.bonk svg{animation:shake .08s linear 6 alternate}
  @keyframes shake{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
  .bit{animation:fly .9s ease-out forwards}
  @keyframes fly{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(260deg)}}
  .gain.go{animation:gain 1.8s ease-out forwards}
  @keyframes gain{0%{opacity:0;transform:translateY(10px)}15%{opacity:1}70%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
  .digger.idle svg{animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:translateY(-2px)}}
}
@media (prefers-reduced-motion:reduce){.world,.dark,.digger .beam{transition:none}.gain.go{opacity:1}}
@media (max-width:560px){.mine{height:240px}.mark{left:42%;font-size:.72rem}}

.chest{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,#5a3418,#3d2210);border:3px solid #8a5a22;border-radius:14px;padding:8px 12px;box-shadow:inset 0 2px 0 rgba(255,220,150,.25),0 5px 0 #24130a}
.chest .lbl{font-family:var(--f-mono);font-size:.75rem;color:#f3d8a8;text-transform:uppercase;letter-spacing:.08em}
.slots{display:flex;gap:6px}
.slot{width:32px;height:32px;border-radius:8px;background:rgba(0,0,0,.35);border:2px dashed rgba(243,216,168,.3);display:grid;place-items:center}
.slot.cur{border:2px solid var(--gold)}
.slot.full{border-style:solid;border-color:rgba(243,216,168,.4)}
.slot .x{color:var(--bad);font-weight:800}

.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.eyebrow{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.1}
h2{font-size:1.4rem;line-height:1.15}
.sub{color:var(--muted);margin:0}
form{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{flex:1 1 220px;min-width:0;padding:13px 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font-size:1.1rem;font-weight:700}
input[type=text]::placeholder{color:var(--muted);font-weight:500}
input[type=text]:focus{border-color:var(--gold);outline:none}
.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;background:var(--gold);color:var(--gold-ink);box-shadow:0 4px 0 #a86a00;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a86a00}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--muted);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--ink);border-color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{min-height:1.5em;margin:0;font-weight:800}
.msg.bad{color:var(--bad)}
.msg.ok{color:var(--g5)}

.find{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.find .art{width:72px;height:72px;display:grid;place-items:center;flex:none}
.find .big{font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.05}
.find .meta{display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.8rem;padding:4px 10px;border-radius:999px;border:2px solid currentColor;width:max-content}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
  @keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}
  .find .art svg{animation:rise .7s cubic-bezier(.3,1.7,.5,1)}
  @keyframes rise{from{transform:translateY(24px) scale(.3) rotate(-20deg)}to{transform:none}}
}

.tiers{display:flex;flex-direction:column;gap:14px}
.tier{display:grid;grid-template-columns:160px 1fr;gap:12px;align-items:start;padding-top:14px;border-top:2px dashed var(--line)}
.tier:first-child{border-top:0;padding-top:0}
.tier-h{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:1.1rem;line-height:1.1}
.tier-h small{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{padding:4px 11px;border-radius:999px;font-size:.93rem;font-weight:700;background:var(--rock);border:2px solid var(--line)}
.chip.me,.chip.got{background:var(--tc);color:var(--bg);border-color:var(--tc)}
.chip.me{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--tc)}
.chip.miss{border-style:dashed;color:var(--muted);background:transparent}
.chip.hide{color:transparent;background:repeating-linear-gradient(45deg,var(--rock),var(--rock) 4px,var(--line) 4px,var(--line) 8px);user-select:none;min-width:58px}
@media (max-width:560px){.tier{grid-template-columns:1fr;gap:8px}.slot{width:28px;height:28px}.slots{gap:4px}}

.sum{display:flex;flex-direction:column}
.sum-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:2px dashed var(--line)}
.sum-row:first-child{border-top:0}
.sum-row .cat{min-width:0;font-weight:800}
.sum-row .cat small{display:block;color:var(--muted);font-weight:600}
.pts{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:4ch;color:var(--gold)}
.total{font-family:var(--f-display);font-size:clamp(3rem,11vw,4.6rem);line-height:1;color:var(--gold)}
.total small{font-family:var(--f-mono);font-size:1rem;color:var(--muted)}
.stats{display:flex;gap:24px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.stats b{color:var(--ink);font-size:1.15rem;display:block}
textarea{width:100%;border-radius:12px;border:2px solid var(--line);background:var(--bg);padding:10px;font-family:var(--f-mono);font-size:.85rem;resize:none}

select{padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);max-width:100%;font-weight:700}
.counter{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--gold)}
.note{font-size:.88rem;color:var(--muted);margin:0}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.85rem;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/^(de|het|the)\s+/,'').replace(/[^a-z0-9]/g,'')}
CATS.forEach(c=>{c.items=[];c.a.forEach((s,ti)=>{if(!s)return;s.split(';').forEach(e=>{const p=e.split('/').map(x=>x.trim()).filter(Boolean);c.items.push({name:p[0],tier:ti,keys:[...new Set(p.map(norm))]})})})});

function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let prev=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}return prev[n]}
function match(input,cat){
  const k=norm(input); if(!k)return null;
  let i=cat.items.findIndex(it=>it.keys.includes(k)); if(i>=0)return i;
  const tol=k.length>=9?2:k.length>=5?1:0; if(!tol)return null;
  let best=-1,bd=99; cat.items.forEach((it,ix)=>it.keys.forEach(key=>{if(key.length<4)return;const d=lev(k,key);if(d<bd){bd=d;best=ix}}));
  return bd<=tol?best:null;
}

function shuffle(a,rnd=Math.random){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function mulberry(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  const rarer=it?c.items.filter(x=>x.tier>it.tier).length:0;
  const LINES=['Een kiezel. Je schuifelt een stukje omlaag.','Een amethist! Netjes doorgegraven.','Een saffier! Je zakt flink dieper.','Een robijn! Daar zoeken de meeste mensen niet.','DIAMANT! Je boort recht naar beneden.'];
  const head=it?`<div class="find"><div class="art">${gem(it.tier,64)}</div><div class="meta"><div class="big" style="color:${tc(it.tier)}">${esc(it.name)}</div><span class="tag" style="color:${tc(it.tier)}">${TIERS[it.tier].n} · +${r.pts} m</span></div></div>
    <p class="sub">${LINES[it.tier]} ${rarer===1?'Er lag nog 1 zeldzamere schat.':rarer?`Er lagen nog ${rarer} zeldzamere schatten.`:''}</p>`
    :`<div class="find"><div class="art" style="font-size:3rem;color:var(--bad)">✕</div><div class="meta"><div class="big" style="color:var(--bad)">${r.input?'“'+esc(r.input)+'” telt niet':'Overgeslagen'}</div><span class="tag" style="color:var(--bad)">+0 m</span></div></div><p class="sub">Tok! Je pikhouweel stuit op steen. Hieronder zie je alle ${c.items.length} schatten die hier lagen.</p>`;
  const last=g.round===ROUNDS-1;
  app.innerHTML=bar+`<div class="card pop"><div class="eyebrow">${esc(c.t)}</div><h2>${esc(c.q)}</h2>${head}<div class="row"><button class="btn" id="next">${last?'Bekijk je tocht':'Verder graven'}</button><button class="btn ghost" id="study" type="button">Oefen deze categorie</button></div></div>
    <div class="card"><div class="eyebrow">Alle ${c.items.length} schatten, van kiezel tot diamant</div>${tierList(c,{mine:r.ix})}</div>`;
  const nx=document.getElementById('next'); nx.focus({preventScroll:true});
  nx.onclick=()=>{if(last){g.phase='done';store.set('played',store.get('played',0)+1);if(g.score>store.get('best',0))store.set('best',g.score);if(g.kind==='dag')store.set('dag_'+DAY,{order:g.order,score:g.score,res:g.res});saveResult(g)}else{g.round++;g.phase='ask'}render();setMine(g,false);focusInput()};
  document.getElementById('study').onclick=()=>{newOefen(g.order[g.round]);switchTo('oefen')};
}
function answer(g,v){
  const c=CATS[g.order[g.round]];const ix=v?match(v,c):null;
  const pts=ix!=null?TIERS[c.items[ix].tier].p:0;
  g.res[g.round]={ix,input:v,pts};g.score+=pts;g.phase='reveal';render();
  digAnim(g,pts,ix!=null?c.items[ix].tier:0);
}

function renderOefen(){
  const o=oefen,c=CATS[o.ci];
  const opts=CATS.map((x,i)=>`<option value="${i}" ${i===o.ci?'selected':''}>${esc(x.t)} (${x.items.length})</option>`).join('');
  app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><label class="eyebrow" for="sel">Mijnschacht</label><select id="sel">${opts}</select></div>
    <h1>${esc(c.q)}</h1><p class="sub">Graaf zoveel schatten op als je kunt, zonder tijdslimiet. ${c.n?esc(c.n):''}</p>
    <form id="f" autocomplete="off"><input type="text" id="inp" aria-label="Antwoord" placeholder="Typ een antwoord en druk op Enter…" ${o.shown?'disabled':''}><button class="btn" ${o.shown?'disabled':''}>Graaf!</button></form>
    <p class="msg ${o.ok?'ok':'bad'}" aria-live="polite">${esc(o.msg)}</p>
    <div class="row" style="justify-content:space-between"><span class="counter">${o.found.length} / ${c.items.length} opgegraven</span>
    <span class="row"><button class="btn ghost" id="show" type="button">${o.shown?'Verberg wat je mist':'Toon alle schatten'}</button><button class="btn ghost" id="reset" type="button">Opnieuw</button></span></div></div>
    <div class="card"><div class="eyebrow">${o.shown?'Gestippeld: nog niet gevonden':'Gestreepte vakjes liggen nog onder de grond'}</div>${tierList(c,{found:o.found,shown:o.shown})}</div>`;
  document.getElementById('sel').onchange=e=>{newOefen(+e.target.value);render();focusInput()};
  document.getElementById('show').onclick=()=>{o.shown=!o.shown;o.msg='';render();if(!o.shown)focusInput()};
  document.getElementById('reset').onclick=()=>{newOefen(o.ci);render();focusInput()};
  document.getElementById('f').onsubmit=e=>{e.preventDefault();const v=document.getElementById('inp').value.trim();if(!v)return;
    const ix=match(v,c);
    if(ix==null){o.msg=`“${v}” ligt hier niet begraven.`;o.ok=false}
    else if(o.found.includes(ix)){o.msg=`${c.items[ix].name} had je al opgegraven.`;o.ok=false}
    else{o.found.push(ix);const it=c.items[ix];o.msg=`${it.name}: ${TIERS[it.tier].n.toLowerCase()}!`;o.ok=true;if(o.found.length===c.items.length)o.msg='Mijn leeg! Alles gevonden.'}
    render();focusInput()};
}
function focusInput(){const i=document.getElementById('inp');if(i&&!i.disabled)i.focus({preventScroll:true})}

function saveResult(){}
['dag','onb','oefen'].forEach(m=>document.getElementById('tab-'+m).onclick=()=>switchTo(m));
document.getElementById('brand').innerHTML=gem(4,34)+'<span>Schatgraver</span>';
document.getElementById('legend').innerHTML=TIERS.map((T,i)=>`<span>${gem(i,18)}${T.n} · ${T.p} m</span>`).join('')+'<span>Hoe zeldzaam een antwoord is, is een schatting.</span>';
render(); if(mode!=='oefen')setMine(games[mode],false);
</script>
